# Nginx Proxy Manager deployment overlay for mondo-link.
#
# Self-contained (used standalone, not layered on docker-compose.yml): one
# unified container serves the FastAPI REST API on / and the MCP streamable-HTTP
# transport on /mcp via a single port (8000). NPM reverse-proxies to the fixed
# container_name on the shared external npm_default network. Mirrors the
# gtex-link / mgi-link fleet pattern. mondo-data-init restores the pinned,
# digest-verified data release into the volume; the server reads it read-only.
#
#   docker compose -f docker/docker-compose.npm.yml --env-file .env.docker up -d
name: mondo-link-npm

services:
  # Restores the pinned, digest-verified Mondo data release (a `data-mondo-*`
  # GitHub release of this repo) into the volume and exits; only the private
  # stack network, no proxy network. No upstream download at boot.
  mondo-data-init:
    image: ${MONDO_LINK_IMAGE:?Set MONDO_LINK_IMAGE to ghcr.io/berntpopp/mondo-link@sha256:<digest>}
    pull_policy: missing
    command: ["mondo-link-data", "materialize-data"]
    environment:
      - MONDO_LINK_IMMUTABLE_DATA__REFERENCE_ROOT=/data
    volumes:
      - mondo-data:/data
    networks:
      - mondo_link_internal_net
    restart: "no"
    # This image's own uid:gid (docker/Dockerfile); same as the server.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  mondo_link:
    # Deploy pulls the released, attested image; it never builds from source.
    # Pin a digest, not a tag: there is no `latest`, and only a digest is immutable.
    image: ${MONDO_LINK_IMAGE:?Set MONDO_LINK_IMAGE to ghcr.io/berntpopp/mondo-link@sha256:<digest>}
    pull_policy: missing
    container_name: mondo-link-npm
    depends_on:
      mondo-data-init:
        condition: service_completed_successfully
    # NO published host ports - NPM handles all routing via the container name.
    expose:
      - "8000"
    environment:
      - MONDO_LINK_HOST=0.0.0.0
      - MONDO_LINK_PORT=8000
      - MONDO_LINK_TRANSPORT=unified
      - MONDO_LINK_MCP_PATH=/mcp
      - 'MONDO_LINK_ALLOWED_HOSTS=["localhost","127.0.0.1","::1","mondo-link.genefoundry.org"]'
      - MONDO_LINK_LOG_LEVEL=${LOG_LEVEL_API:-INFO}
      - MONDO_LINK_LOG_FORMAT=json
      # Serve the release restored by mondo-data-init, read-only.
      - MONDO_LINK_DATA__DATA_DIR=/data
      - MONDO_LINK_DATA__DB_FILENAME=current/mondo.sqlite
      - MONDO_LINK_DATA__AUTO_BOOTSTRAP=false
      - MONDO_LINK_DATA__REFRESH_ENABLED=false
    # The image CMD runs the unified server, reading MONDO_LINK_TRANSPORT/HOST/PORT
    # above; no command override needed.
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # GeneFoundry deploy contract: the fleet controller (strato_v6_docker_npm,
    # scripts/utils/deployment_preflight.py) accepts a declared user only as numeric
    # non-root, and its runtime observer proves the effective uid from /proc.
    # This is THIS image's own uid:gid (docker/Dockerfile) -- sibling -link images differ.
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    volumes:
      - mondo-data:/data:ro
    networks:
      - mondo_link_internal_net
      - npm_proxy_network
    deploy:
      resources:
        limits:
          memory: ${MONDO_API_MEMORY_LIMIT:-1g}
          cpus: ${MONDO_API_CPU_LIMIT:-1.0}
          pids: 256
        reservations:
          memory: 256m
          cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=mondo-link,environment=production,proxy=npm"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    init: true

volumes:
  mondo-data:
    driver: local

networks:
  mondo_link_internal_net:
    driver: bridge
    name: mondo_link_internal_net
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:-npm_default}
